name: Firmware and protocol validation
on:
  pull_request:
    paths: ['firmware/**', 'tools/**', 'tests/**', 'web-installer/**', 'Makefile', '.github/workflows/firmware-tests.yml']
  push:
    branches: [main]
    paths: ['firmware/**', 'tools/**', 'tests/**', 'web-installer/**', 'Makefile', '.github/workflows/firmware-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build/link and run firmware, HTTP and protocol checks
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: firmware
          command: idf.py build && make -C .. check fw-fmt
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-installer/package-lock.json
      - working-directory: web-installer
        run: npm ci && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-installer
          path: web-installer/dist
